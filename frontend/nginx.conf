server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # API passthrough (mirrors vite.config.js dev proxy)
  location ~ ^/(health|auth|customers|devices|tickets|categories|users|dashboard|articles|ocr)(/|$) {
    # Browser navigation loads React; JSON fetch requests still reach the API.
    if ($http_accept ~* "text/html") {
      rewrite ^ /index.html last;
    }
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
  }

  # Hashed assets: safe to cache forever
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    try_files $uri /index.html;
    # index.html must always be revalidated so new builds are picked up
    add_header Cache-Control "no-cache, must-revalidate";
  }
}
