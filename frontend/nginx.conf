server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # API passthrough (mirrors vite.config.js dev proxy)
  location ~ ^/(health|auth|customers|devices|tickets|categories|users|dashboard|articles|ocr)(/|$) {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
  }

  location / {
    try_files $uri /index.html;
  }
}
