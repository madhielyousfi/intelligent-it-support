# Full-stack compose (Session 10). DB-only-container era is over for deployment;
# local dev can still use the native flow from the README.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: itsm
      POSTGRES_PASSWORD: itsm_dev_password
      POSTGRES_DB: itsm_db
    volumes:
      - itsm-pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U itsm"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://itsm:itsm_dev_password@postgres:5432/itsm_db
      SECRET_KEY: change-me-in-production-use-long-random-string
    depends_on:
      - postgres
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  itsm-pgdata:
